<section class="section testimonial-section">
  <div class="container">
    <h2 class="section-title">✦ Testimonials ✦</h2>
    <p class="section-subtitle">Hear what our customers have to say</p>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let review of reviews">
        <div class="testimonial-card h-100">
          <i class="bi bi-quote quote-icon"></i>
          <p class="quote-text">{{ review.quote }}</p>
          <div class="stars">
            <i class="bi bi-star-fill" *ngFor="let s of starsArray(review.rating)"></i>
          </div>
          <span class="reviewer-name">{{ review.name }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
