<section class="section">
  <div class="container">
    <h2 class="section-title">✦ {{ title }} ✦</h2>
    <p class="section-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    <div class="divider-leaf" *ngIf="!subtitle"></div>

    <div class="row g-4">
      <ng-container *ngIf="products.length > 0; else emptyState">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of products">
          <app-product-card [product]="product" (addToCart)="handleAdd($event)"></app-product-card>
        </div>
      </ng-container>
      <ng-template #emptyState>
        <p class="text-center text-muted">No products available right now.</p>
      </ng-template>
    </div>

    <div class="text-center mt-4">
      <a [routerLink]="['/shop', category]" class="btn-outline-brand">View All</a>
    </div>
  </div>
</section>
