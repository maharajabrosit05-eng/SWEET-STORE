<section class="section contact-page">
  <div class="container">
    <h1 class="section-title">Contact Us</h1>
    <div class="divider-leaf"></div>

    <div class="row justify-content-center">
      <div class="col-lg-6">

        <ng-container *ngIf="!submitted; else successBlock">
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="contact-form">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" formControlName="name" />
              <small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
                Name is required.
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
              <small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                Enter a valid email address.
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" formControlName="message"></textarea>
              <small class="text-danger" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
                Message cannot be empty.
              </small>
            </div>

            <button type="submit" class="btn-brand w-100">Send Message</button>
          </form>
        </ng-container>

        <ng-template #successBlock>
          <div class="text-center py-5">
            <i class="bi bi-check-circle-fill display-4 text-success"></i>
            <h5 class="mt-3">Thanks for reaching out!</h5>
            <p class="text-muted">We'll get back to you within 24 hours.</p>
          </div>
        </ng-template>

      </div>
    </div>
  </div>
</section>
