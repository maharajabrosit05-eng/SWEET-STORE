<section class="shop-hero">
  <div class="container text-center">
    <h1 class="shop-title">Shop All</h1>
    <p class="shop-subtitle">Traditional sweets and savouries, made fresh and shipped with care.</p>
  </div>
</section>

<section class="section pt-4">
  <div class="container">

    <div class="filter-bar d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div class="filter-control">
        <label class="filter-label">Category</label>
        <ng-select
          class="brand-select"
          [items]="categoryOptions"
          bindLabel="label"
          bindValue="value"
          [clearable]="false"
          [searchable]="false"
          [(ngModel)]="selectedCategory"
        ></ng-select>
      </div>

      <div class="filter-control">
        <label class="filter-label">Sort by</label>
        <ng-select
          class="brand-select"
          [items]="sortOptions"
          bindLabel="label"
          bindValue="value"
          [clearable]="false"
          [searchable]="false"
          [(ngModel)]="selectedSort"
        ></ng-select>
      </div>
    </div>

    <ng-container *ngIf="products.length > 0; else noProducts">
      <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" *ngFor="let product of products">
          <app-product-card [product]="product" (addToCart)="handleAdd($event)"></app-product-card>
        </div>
      </div>
    </ng-container>

    <ng-template #noProducts>
      <div class="text-center py-5">
        <i class="bi bi-emoji-frown display-4 text-muted"></i>
        <p class="text-muted mt-2">No products found in this category yet.</p>
      </div>
    </ng-template>

  </div>
</section>
