<div class="announcement-bar">
  <div class="track">
    <ng-container *ngFor="let msg of messages; let i = index">
      <span class="msg">{{ msg }}</span>
      <span class="dot" *ngIf="i < messages.length - 1">•</span>
    </ng-container>

      <span class="msg">{{ msg }}</span>

    </ng-container>
  </div>
</div>
